profile_id: e3_default
profile_version: "1.1.0"
display_name: Core plant and human E3 ubiquitin-ligase systems and comparison proteins
require_structural_evidence: true

default_comparison:
  target_root_label_id: e3
  background_label_id: control:prespecified_non_e3_reference
  excluded_label_ids: [e3, e3:ubiquitin, e3:ubl]
  excluded_subtree_label_ids: [e3:associated]
  description: >-
    Prespecified comparison against the mechanism- or component-role-specific
    reference resolved for the target. Each reference must be curated before
    signature inspection and matched for its stated biological and technical
    covariates; confirmatory campaigns must document that matching explicitly.

# This is a controlled vocabulary, not an automatic annotation rule set.
# Exact protein-to-label assignments require evidence-bearing curation rows.
labels:
  - label_id: protein
    reviewed_positive_allowed: false
    display_name: Protein
    parent_label_id: ""
    level: root
    system_class: ""
    mechanistic_class: ""
    component_role: UNKNOWN
    aliases: []
    description: Root of the configurable protein-type hierarchy.

  - label_id: e3
    reviewed_positive_allowed: false
    display_name: E3 or E3-system protein
    parent_label_id: protein
    level: system_group
    system_class: E3_SYSTEM
    mechanistic_class: ""
    component_role: UNKNOWN
    aliases: [E3 ligase, ubiquitin ligase system]
    description: Reviewed catalytic E3 proteins and separately identified components of E3 systems.

  - label_id: e3:ubiquitin
    reviewed_positive_allowed: false
    display_name: Ubiquitin E3 system
    parent_label_id: e3
    level: modifier_system
    system_class: UBIQUITIN_E3
    mechanistic_class: ""
    component_role: UNKNOWN
    aliases: [ubiquitin E3]
    description: E3 systems acting on ubiquitin rather than another ubiquitin-like modifier.

  - label_id: e3:ubiquitin:ring
