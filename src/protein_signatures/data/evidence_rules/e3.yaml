schema_version: 1
ruleset_id: e3_evidence_defaults
ruleset_version: "1.0.0"
profile_id: e3_default

# These rules create provisional evidence-supported hypotheses, not reviewed
# biochemical truth. A normal annotation requires independent corroboration;
# a single annotation can stand alone only when it is both highly specific and
# supplied as direct/exact-protein evidence by a trusted authority.
settings:
  annotation_score: 2.0
  specific_annotation_score: 4.0
  pfam_score: 2.0
  supporting_pfam_score: 0.5
  orthology_score: 2.0
  trusted_label_score: 5.0
  minimum_acceptance_score: 3.5
  minimum_evidence_groups: 2
  minimum_score_margin: 1.0
  require_target_structure_eligible: true
  orthology_propagation_enabled: true
  minimum_orthology_anchor_proteins: 2
  control_units_per_target_unit: 3
  minimum_control_units_per_background: 3
  require_species_match: true
  require_structure_match: true
  maximum_log2_length_difference: 0.75
  maximum_domain_count_difference: 2
  exclude_input_candidates_from_controls: true

label_rules:
  - rule_id: ring_parent
    label_id: e3:ubiquitin:ring
    priority: 50
    annotation_patterns: ['\bRING(?:[- ](?:finger|type))?\b']
    specific_annotation_patterns: ['\bRING[- ]type E3(?: ubiquitin)? ligase\b']
    exclusion_patterns: ['\bRING[- ]box\b', '\bRING1\b.*\bIBR\b.*\bRING2\b']
    required_domain_patterns: &ring_domains ['^(PF00097|PF12906|PF13639|PF13920|PF15227)\b|\bRING(?: finger)?(?: domain)?\b']
    supporting_domain_patterns: []
    allow_specific_annotation_only: false
    propagate_by_orthology: true

