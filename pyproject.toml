[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-signature-analysis"
version = "0.1.0"
description = "Reproducible discovery and visualisation of protein-family sequence and structural signatures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Peter Thorpe and collaborators"}]
keywords = [
  "bioinformatics",
  "protein signatures",
  "structural bioinformatics",
  "E3 ubiquitin ligase",
  "AlphaFold",
  "Foldseek",
  "OrthoFinder",
  "SHAP",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "duckdb>=1.4,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<27",
  "PyYAML>=6,<7",
  "scikit-learn>=1.8,<2",
  "shap>=0.50,<1",
  "XlsxWriter>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/peterthorpe5/protein-signature-analysis"
Repository = "https://github.com/peterthorpe5/protein-signature-analysis"
Issues = "https://github.com/peterthorpe5/protein-signature-analysis/issues"

[project.optional-dependencies]
app = [
  "kaleido>=1,<2",
  "plotly>=6,<7",
  "streamlit>=1.52,<2",
]
dev = [
  "build>=1.2,<2",
  "coverage>=7.6,<8",
  "jsonschema>=4.23,<5",
  "pycodestyle>=2.12,<3",
  "pydocstyle>=6.3,<7",
  "pytest>=8,<9",
  "ruff>=0.15,<1",
  "numpy>=2,<3",
  "scikit-learn>=1.8,<2",
  "shap>=0.50,<1",
]

[project.scripts]
protein-signatures = "protein_signatures.cli:main"
protein-signature-app = "protein_signature_app.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protein_signatures = ["data/profiles/*.yaml"]

[tool.coverage.run]
branch = true
source = ["protein_signatures", "protein_signature_app"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95
precision = 2

[tool.pycodestyle]
max-line-length = 100
exclude = ".git,.venv,__pycache__,build,dist"
ignore = "E203,W503"

[tool.pydocstyle]
convention = "google"
add-ignore = ["D105", "D107", "D202"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
